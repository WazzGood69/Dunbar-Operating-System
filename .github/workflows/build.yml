name: Build Dunbar OS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install NASM
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Build bootable image
        run: make

      - name: Verify boot signature
        run: |
          python3 - <<'PY'
          data = open("build/dunbar.img", "rb").read(512)
          assert data[510:512] == b"\x55\xaa", "Missing BIOS boot signature"
          print("BIOS boot signature OK")
          PY

      - name: Upload Dunbar OS image
        uses: actions/upload-artifact@v4
        with:
          name: dunbar-os-bios-image
          path: build/dunbar.img
