# COMPUTER capability policy
# This is an architecture manifest for the future Dunbar capability broker.

[computer]
enabled = true
personality = "default"
memory = "user-controlled"

[capabilities]
system.read = true
process.read = true
filesystem.read = true
filesystem.write = true
application.launch = true
application.control = true
input.control = true
window.control = true
browser.control = true
network.read = true
settings.read = true
settings.write = true

# Destructive operations are not granted implicitly.
filesystem.delete = confirm
system.shutdown = confirm
system.reboot = confirm
software.install = confirm
system.update = confirm

[privacy]
filter_credentials = true
filter_private_keys = true
filter_auth_tokens = true
direct_kernel_access = false
